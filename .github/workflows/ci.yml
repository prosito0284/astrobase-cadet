# En cada push y Pull Request: dependencias sin fallas conocidas, tipos, tests,
# build y una partida completa en Chrome (smoke). Si algo falla, se ve en rojo
# en GitHub antes de que llegue a los niños.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 12 * * 1' # cada lunes: avisa si aparece una vulnerabilidad nueva

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --audit-level=high
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Resumen de tests que fallaron
        if: failure()
        shell: bash
        run: |
          echo '## ❌ Tests que fallaron' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*✖|^\s*not ok' test.log | head -40 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          # También como anotaciones (se ven en la lista de checks del commit).
          grep -E '^\s*✖|^\s*not ok|AssertionError|Error:|error:|Cannot find' test.log | head -12 | while IFS= read -r l; do echo "::error::$l"; done || true
      - name: Puente /api empaquetado y al día
        run: npm run build:api -- --check
      - name: Build (incluye revisión de tipos)
        run: npm run build
      - name: Smoke (partida completa en Chrome)
        run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
