# Revisa cada semana si hay versiones nuevas (o con arreglos de seguridad) de las
# librerías del juego y de las acciones de GitHub, y propone un Pull Request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
